<template>
    <lightning-card>
        <template if:true={data}>
        <lightning-datatable key-field="Id" data={data} columns={COLUMNS}></lightning-datatable>
        </template>
        <template if:true={errors}>
            <p>{errors}</p>
        </template>

        <lightning-button onclick={getData} label="Submit">

        </lightning-button>
    </lightning-card>

</template>
